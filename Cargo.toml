[package]
name = "frenchquiz"
version = "0.1.0"
edition = "2021"
authors = ["Felix Graham"]
description = "A minimalist, keyboard-only, terminal French vocabulary quiz."

[[bin]]
name = "frenchquiz"
path = "src/main.rs"

[dependencies]
crossterm = "0.27"
serde = { version = "1", features = ["derive"] }
toml = "0.7"
rand = "0.8"
strsim = "0.11"
dirs = "5"
time = { version = "=0.3.36", default-features = false, features = ["local-offset"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
